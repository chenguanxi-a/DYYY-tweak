name: Build Tweak
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git ~/theos
          echo 'THEOS=$HOME/theos' >> $GITHUB_ENV
          export PATH=$HOME/theos/bin:$PATH

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          export NO_CODESIGN=1
          make NO_PACKAGE=1

      - name: Upload dylib and plist
        uses: actions/upload-artifact@v4
        with:
          name: DYYYPP-tweak
          path: |
            .theos/obj/DYYYPP.dylib
            DYYYPP.plist
