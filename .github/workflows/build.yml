name: Build DYYY++ dylib

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS tweak
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          rm -rf $HOME/theos
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          curl -sL https://github.com/procursus/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 -o $HOME/theos/bin/ldid
          chmod +x $HOME/theos/bin/ldid
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install SDKs
        run: |
          rm -rf $HOME/theos/sdks/*
          curl -sL https://github.com/itsnebulalol/sdks/archive/main.tar.gz | tar -xzf - --strip-components=1 -C $HOME/theos/sdks
          ls $HOME/theos/sdks/

      - name: Build
        run: |
          export THEOS=$HOME/theos
          set -e
          make package 2>&1 | tee build.log
          echo "Build exit code: ${PIPESTATUS[0]}"
          echo "=== LAST 150 LINES OF BUILD LOG ==="
          tail -150 build.log
          ls -la packages/

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: DYYY--dylib
          path: packages/*.dylib
          if-no-files-found: error

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: DYYY--deb
          path: packages/*.deb
          if-no-files-found: error
