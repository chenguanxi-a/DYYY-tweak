name: Build DYYY++ dylib

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS tweak
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          rm -rf $HOME/theos
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          curl -sL https://github.com/procursus/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 -o $HOME/theos/bin/ldid
          chmod +x $HOME/theos/bin/ldid
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_ENV

      - name: Install SDKs
        run: |
          rm -rf $HOME/theos/sdks/*
          curl -sL https://github.com/itsnebulalol/sdks/archive/main.tar.gz | tar -xzf - --strip-components=1 -C $HOME/theos/sdks
          ls $HOME/theos/sdks/
          echo "iPhoneOS15.0.sdk exists:"
          test -d $HOME/theos/sdks/iPhoneOS15.0.sdk && echo "YES" || echo "NO"

      - name: Build
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          echo "THEOS=$THEOS"
          echo "PATH=$PATH"
          echo "which make: $(which make)"
          make --version | head -1
          set -e
          make clean || true
          make package V=1 2>&1 | tee build.log
          echo "Exit code: ${PIPESTATUS[0]}"
          ls -la packages/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: DYYY--dylib
          path: packages/*.dylib
          if-no-files-found: warn

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: DYYY--deb
          path: packages/*.deb
          if-no-files-found: warn