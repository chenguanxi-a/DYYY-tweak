name: Build Tweak
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git ~/theos
          brew install ldid

      - name: Detect iOS SDK version
        run: |
          VER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "SDK_VERSION=$VER" >> $GITHUB_ENV
          echo "Detected iOS SDK: $VER"

      - name: Build Tweak
        env:
          THEOS: ~/theos
          SDK_VERSION: ${{ env.SDK_VERSION }}
        run: |
          export PATH=$THEOS/bin:$PATH
          export NO_CODESIGN=1
          sed -i '' 's|TARGET = iphone:clang:.*|TARGET = iphone:clang:${SDK_VERSION}:15.0|' Makefile
          cat Makefile | grep '^TARGET'
          make NO_PACKAGE=1

      - name: Debug - list compiled files
        run: |
          ls -la .theos/
          ls -la .theos/obj/ || true
          ls -la .theos/lib/ || true

      - name: Upload dylib and plist
        uses: actions/upload-artifact@v4
        with:
          name: DYYYPP-tweak
          path: |
            .theos/obj/
            .theos/lib/
            DYYYPP.plist
