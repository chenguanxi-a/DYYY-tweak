name: Build Tweak
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git ~/theos
          echo 'THEOS=$HOME/theos' >> $GITHUB_ENV
          sudo apt update
          sudo apt install -y git make clang
          curl -L https://github.com/theos/ldid/releases/latest/download/ldid-linux -o ~/theos/bin/ldid
          chmod +x ~/theos/bin/ldid

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make NO_PACKAGE=1

      - name: Upload dylib and plist
        uses: actions/upload-artifact@v4
        with:
          name: DYYYPP-tweak
          path: |
            .theos/obj/DYYYPP.dylib
            DYYYPP.plist
