name: Build DYYY++ dylib

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS tweak
    # Theos requires macOS — ubuntu-latest cannot cross-compile iOS tweaks properly.
    # See: https://github.com/ab6866/theos-tweak-pipeline
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          rm -rf $THEOS
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          VER="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $SDK (version $VER)"
          mkdir -p $THEOS/sdks
          ln -sfn "$SDK" "$THEOS/sdks/iPhoneOS${VER}.sdk"
          ls -la $THEOS/sdks/

      - name: Build
        run: |
          export THEOS=$THEOS
          export PATH=$THEOS/bin:$PATH
          echo "THEOS=$THEOS"
          echo "PATH=$PATH"
          echo "which make: $(which make)"
          echo "which clang: $(which clang)"
          set -e
          make clean || true
          rm -rf packages
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 DEBUG=0
          echo "Exit code: $?"
          ls -la packages/
          cat build.log 2>/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: DYYY--dylib
          path: packages/*.dylib
          if-no-files-found: warn

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: DYYY--deb
          path: packages/*.deb
          if-no-files-found: warn
