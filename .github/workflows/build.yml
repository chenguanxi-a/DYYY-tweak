name: Build Tweak
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git ~/theos
          brew install ldid

      - name: Detect iOS SDK version
        run: |
          VER=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "SDK_VERSION=$VER" >> $GITHUB_ENV
          echo "Detected iOS SDK: $VER"

      - name: Build Tweak
        env:
          THEOS: ~/theos
          SDK_VERSION: ${{ env.SDK_VERSION }}
        run: |
          export PATH=$THEOS/bin:$PATH
          export NO_CODESIGN=1
          sed -i '' 's|TARGET = iphone:clang:.*|TARGET = iphone:clang:${SDK_VERSION}:15.0|' Makefile
          cat Makefile | grep '^TARGET'
          # 确保 Makefile 里的 ARCHS 被覆盖为单架构 arm64
          sed -i '' 's|^ARCHS = .*|ARCHS = arm64|' Makefile
          grep '^ARCHS' Makefile
          make clean
          make NO_PACKAGE=1 FINALPACKAGE=1 ARCHS=arm64

      - name: Strip dylib symbols
        run: |
          DYLIB=$(find .theos/obj -name 'DYXXQ.dylib' | head -1)
          echo "Stripping: $DYLIB"
          strip -x -S "$DYLIB" || echo "strip failed, continuing"
          ldid -S "$DYLIB" || echo "ldid strip signature failed, continuing"
          file "$DYLIB"
          # 验证是否为单架构 Mach-O（非 fat）
          vtool -show "$DYLIB" 2>/dev/null || echo "vtool not available, skipping arch check"
      - name: Copy dylib to release folder
        run: |
          mkdir -p release
          find .theos -name 'DYXXQ.dylib' -exec cp {} release/DYXXQ.dylib \;
          ls -la release/

      - name: Verify single-arch Mach-O (not fat)
        run: |
          echo '=== file ==='
          file release/DYXXQ.dylib
          echo '=== vtool -show ==='
          vtool -show release/DYXXQ.dylib 2>/dev/null || echo 'vtool unavailable'
          # if fat binary, extract arm64 slice
          if file release/DYXXQ.dylib | grep -q 'Mach-O universal binary'; then
            echo 'Fat binary detected, extracting arm64 slice...'
            vtool -arch arm64 -replace -output release/DYXXQ.dylib release/DYXXQ.dylib
            echo '=== after extraction ==='
            file release/DYXXQ.dylib
            vtool -show release/DYXXQ.dylib
          fi

      - name: Upload dylib and plist
        uses: actions/upload-artifact@v4
        with:
          name: DYXXQ-tweak
          path: |
            release/DYXXQ.dylib
            DYXXQ.plist
